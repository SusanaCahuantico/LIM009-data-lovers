<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Data Lovers</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 font-sans">
  <header class="bg-yellow-400 p-4 flex flex-col md:flex-row justify-between items-center shadow-md">
    <h1 class="text-2xl font-bold text-gray-800">POKEMON</h1>
    <div class="flex space-x-4 mt-2 md:mt-0">
      <!-- <button id="mostrarPokemones" class="bg-blue-500 text-white px-4 py-2 rounded shadow hover:bg-blue-600">Pokemones</button> -->
      <select id="orden-pokemon" class="p-2 border rounded">
        <option value="">Ordenar</option>
        <option value="ordenaz">A - Z</option>
        <option value="ordenza">Z - A</option>
      </select>
      <select id="tiposPokemon" class="p-2 border rounded">
        <option value="">Filtrado por tipo</option>
        <option value="Grass">Hierba</option>
        <option value="Poison">Veneno</option>
        <option value="Fire">Fuego</option>
        <option value="Ice">Hielo</option>
        <option value="Flying">Volador</option>
        <option value="Psychic">Psíquico</option>
        <option value="Water">Agua</option>
        <option value="Ground">Suelo</option>
        <option value="Rock">Roca</option>
        <option value="Electric">Eléctrico</option>
        <option value="Bug">Insecto</option>
        <option value="Normal">Normal</option>
        <option value="Fighting">Peleador</option>
        <option value="Ghost">Fantasma</option>
        <option value="Dragon">Dragón</option>
      </select>
    </div>
  </header>

  <main class="p-4">
    <button id="botonPromedio" class="bg-green-500 text-white px-4 py-2 rounded shadow hover:bg-green-600 mb-4">Promedio del peso</button>
    <p id="resultPromedio" class="text-lg font-semibold text-gray-700"></p>
    <div id="container" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 mt-4"></div>
  </main>

  <footer class="text-center p-4 text-gray-600">©Susana Cahuantico 2025 Data Lovers</footer>

  <script src="./data/pokemon/pokemon.js"></script>
  <script src="data.js"></script>
  <script src="main.js"></script>
</body>

</html>
